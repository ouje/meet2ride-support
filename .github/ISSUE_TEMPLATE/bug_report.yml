name: Bug report
description: Report a problem in Meet2Ride
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Opened...
        2. Tapped...
        3. Saw...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "e.g. 1.0.2"

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Screenshots, device model, or anything else useful.
