name: Feature request
description: Suggest an improvement for Meet2Ride
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the need or problem.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: Describe how you imagine it should work.
