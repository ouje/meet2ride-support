name: Translation
description: Request a new language or offer to help translate Meet2Ride
title: "[Translation]: "
labels: ["translation"]
body:
  - type: dropdown
    id: request-type
    attributes:
      label: What do you need?
      options:
        - I want Meet2Ride in a new language
        - I can help translate Meet2Ride
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: Use the English name of the language (for example Slovak, German, French).
      placeholder: "e.g. Slovak"
    validations:
      required: true

  - type: input
    id: locale
    attributes:
      label: Locale code (optional)
      description: If you know it, add the locale code (for example sk, de, fr).
      placeholder: "e.g. sk"

  - type: dropdown
    id: native-speaker
    attributes:
      label: Are you a native or fluent speaker of this language?
      options:
        - "Yes"
        - "No, but I would still like the language added"
        - "Not applicable (language request only)"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why this language?
      description: Tell us why this language would be useful for Meet2Ride users.
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: How can you help? (optional)
      description: |
        If you want to contribute translations, describe what you can do.
        For example: translate the whole app, review existing translations, or maintain updates after new releases.
      placeholder: |
        I am a native speaker and can translate new app versions within a few days.

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I understand that Meet2Ride source code is private and translations are added by the Meet2Ride team after review.
          required: true
